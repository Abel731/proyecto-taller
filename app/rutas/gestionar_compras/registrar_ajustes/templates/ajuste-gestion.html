{% extends 'base.html' %}

{% block titulo %}
Registrar Ajuste de Stock
{% endblock %}

{% block contenido %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3 bg-primary text-white">
            <h6 class="m-0 font-weight-bold">Registrar Ajuste de Stock</h6>
        </div>
        <div class="card-body">
            <div class="row">
                <!-- ========== COLUMNA IZQUIERDA ========== -->
                <div class="col-md-6">
                    <!-- Empleado -->
                    <div class="form-group">
                        <label for="cbo_empleado">Empleado que registra: <span class="text-danger">*</span></label>
                        <select id="cbo_empleado" class="form-control">
                            <option value="">Seleccione un empleado...</option>
                            {% for emp in empleados %}
                            <option value="{{ emp['id_empleado'] }}">
                                {{ emp['empleado'] }} - CI: {{ emp['ci'] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Depósito -->
                    <div class="form-group">
                        <label for="cbo_deposito">Depósito: <span class="text-danger">*</span></label>
                        <select id="cbo_deposito" class="form-control">
                            <option value="">Seleccione un depósito...</option>
                            {% for dep in depositos %}
                            <option value="{{ dep['id_deposito'] }}">{{ dep['descripcion'] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Fecha de Ajuste -->
                    <div class="form-group">
                        <label for="txt_fecha_ajuste">Fecha de Ajuste: <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="txt_fecha_ajuste">
                    </div>
                </div>

                <!-- ========== COLUMNA DERECHA ========== -->
                <div class="col-md-6">
                    <!-- Tipo de Ajuste -->
                    <div class="form-group">
                        <label>Tipo de Ajuste: <span class="text-danger">*</span></label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipo_ajuste" 
                                   id="tipo_positivo" value="POSITIVO" checked>
                            <label class="form-check-label" for="tipo_positivo">
                                <i class="fas fa-plus-circle text-success"></i> Positivo (Aumentar)
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipo_ajuste" 
                                   id="tipo_negativo" value="NEGATIVO">
                            <label class="form-check-label" for="tipo_negativo">
                                <i class="fas fa-minus-circle text-warning"></i> Negativo (Disminuir)
                            </label>
                        </div>
                    </div>

                    <!-- Observaciones -->
                    <div class="form-group">
                        <label for="txt_observacion">Observaciones:</label>
                        <textarea class="form-control" id="txt_observacion" rows="4" 
                                  placeholder="Observaciones adicionales (opcional)"></textarea>
                    </div>
                </div>
            </div>

            <hr>

            <!-- ========== DETALLE DE PRODUCTOS ========== -->
            <h5>Detalle de Productos</h5>
            
            <!-- Agregar Producto -->
            <div class="row mb-3">
                <div class="col-md-5">
                    <label>Producto:</label>
                    <select id="cbo_producto" class="form-control">
                        <option value="">Seleccione un producto...</option>
                        {% for prod in productos %}
                        <option value="{{ prod['id_producto'] }}">{{ prod['nombre'] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label>Cantidad:</label>
                    <input type="number" id="txt_cantidad" class="form-control" min="1" value="1">
                </div>
                <div class="col-md-4">
                    <label>Motivo:</label>
                    <select id="cbo_motivo" class="form-control">
                        <option value="">Seleccione un motivo...</option>
                        {% for mot in motivos %}
                        <option value="{{ mot['id_motivo_ajuste'] }}">{{ mot['descripcion'] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-1">
                    <label>&nbsp;</label>
                    <button type="button" class="btn btn-success btn-block" id="btn_agregar_producto">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Tabla de Productos -->
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="thead-light">
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Motivo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="productos_table_body">
                        <tr>
                            <td colspan="5" class="text-center text-muted">
                                No hay productos agregados
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ========== FOOTER CON BOTONES ========== -->
        <div class="card-footer">
            <button type="button" class="btn btn-success btn-icon-split" id="btn_registrar">
                <span class="icon text-white-50">
                    <i class="fas fa-save"></i>
                </span>
                <span class="text">Registrar Ajuste</span>
            </button>
            <button type="button" class="btn btn-secondary btn-icon-split" id="btn_volver">
                <span class="icon text-white-50">
                    <i class="fas fa-arrow-left"></i>
                </span>
                <span class="text">Volver al Listado</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    // ========== VARIABLES GLOBALES ==========
    let productosAjuste = [];

    // ========== INICIALIZACIÓN ==========
    $(document).ready(function() {
        console.log('========== INICIO DE CARGA GESTIÓN AJUSTE ==========');
        establecerFechaActual();
        eventoAgregarProducto();
        eventoRegistrar();
        eventoVolver();
    });

    // ========== ESTABLECER FECHA ACTUAL ==========
    function establecerFechaActual() {
        const hoy = new Date().toISOString().split('T')[0];
        $('#txt_fecha_ajuste').val(hoy);
        console.log('DEBUG: Fecha actual establecida:', hoy);
    }

    // ========== AGREGAR PRODUCTO ==========
    function eventoAgregarProducto() {
        $('#btn_agregar_producto').on('click', function() {
            console.log('DEBUG: Agregando producto...');
            
            const idProducto = parseInt($('#cbo_producto').val());
            const nombreProducto = $('#cbo_producto option:selected').text();
            const cantidad = parseInt($('#txt_cantidad').val());
            const idMotivo = parseInt($('#cbo_motivo').val());
            const nombreMotivo = $('#cbo_motivo option:selected').text();

            // Validaciones
            if (!idProducto) {
                Swal.fire('Error', 'Debe seleccionar un producto', 'error');
                return;
            }
            if (!cantidad || cantidad <= 0) {
                Swal.fire('Error', 'La cantidad debe ser mayor a 0', 'error');
                return;
            }
            if (!idMotivo) {
                Swal.fire('Error', 'Debe seleccionar un motivo', 'error');
                return;
            }

            // Verificar si el producto ya está en la lista
            if (productosAjuste.find(p => p.id_producto === idProducto)) {
                Swal.fire('Error', 'Este producto ya está en la lista', 'warning');
                return;
            }

            // Agregar a la lista
            productosAjuste.push({
                id_producto: idProducto,
                nombre: nombreProducto,
                cantidad: cantidad,
                id_motivo_ajuste: idMotivo,
                motivo: nombreMotivo
            });

            console.log('DEBUG: Producto agregado:', productosAjuste);

            // Actualizar tabla
            actualizarTablaProductos();

            // Limpiar campos
            $('#cbo_producto').val('');
            $('#txt_cantidad').val(1);
            $('#cbo_motivo').val('');
        });
    }

    // ========== ACTUALIZAR TABLA ==========
    function actualizarTablaProductos() {
        const tbody = $('#productos_table_body');
        tbody.empty();

        if (productosAjuste.length === 0) {
            tbody.html(`
                <tr>
                    <td colspan="5" class="text-center text-muted">
                        No hay productos agregados
                    </td>
                </tr>
            `);
            return;
        }

        productosAjuste.forEach(prod => {
            const fila = `
                <tr>
                    <td>${prod.id_producto}</td>
                    <td>${prod.nombre}</td>
                    <td>${prod.cantidad}</td>
                    <td>${prod.motivo}</td>
                    <td class="text-center">
                        <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${prod.id_producto})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            tbody.append(fila);
        });
    }

    // ========== ELIMINAR PRODUCTO ==========
    function eliminarProducto(idProducto) {
        console.log('DEBUG: Eliminando producto:', idProducto);
        productosAjuste = productosAjuste.filter(p => p.id_producto !== idProducto);
        actualizarTablaProductos();
    }

    // ========== VALIDAR FORMULARIO ==========
    function validarFormulario() {
        console.log('========== VALIDANDO FORMULARIO ==========');
        
        const empleado = $('#cbo_empleado').val();
        const deposito = $('#cbo_deposito').val();
        const fecha = $('#txt_fecha_ajuste').val();

        if (!empleado) {
            Swal.fire('Error', 'Debe seleccionar un empleado', 'error');
            return false;
        }
        if (!deposito) {
            Swal.fire('Error', 'Debe seleccionar un depósito', 'error');
            return false;
        }
        if (!fecha) {
            Swal.fire('Error', 'Debe ingresar la fecha de ajuste', 'error');
            return false;
        }
        if (productosAjuste.length === 0) {
            Swal.fire('Error', 'Debe agregar al menos un producto', 'error');
            return false;
        }

        console.log('DEBUG: Validación exitosa');
        return true;
    }

    // ========== REGISTRAR AJUSTE ==========
    function eventoRegistrar() {
        $('#btn_registrar').on('click', function() {
            console.log('========== REGISTRAR AJUSTE ==========');
            
            if (!validarFormulario()) {
                return;
            }

            const tipoAjuste = $('input[name="tipo_ajuste"]:checked').val();

            const payload = {
                id_empleado: parseInt($('#cbo_empleado').val()),
                id_deposito: parseInt($('#cbo_deposito').val()),
                tipo_ajuste: tipoAjuste,
                fecha_ajuste: $('#txt_fecha_ajuste').val(),
                observacion: $('#txt_observacion').val() || null,
                detalle_ajuste: productosAjuste
            };

            console.log('DEBUG: Payload a enviar:', payload);

            // Confirmación
            Swal.fire({
                title: '¿Registrar este ajuste?',
                html: `
                    <p>Tipo: <strong>${tipoAjuste}</strong></p>
                    <p>Productos: <strong>${productosAjuste.length}</strong></p>
                    <p class="text-warning">Este ajuste modificará el stock actual</p>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, registrar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Loading
                    Swal.fire({
                        title: 'Registrando ajuste...',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    // Request
                    fetch('/api/v1/gestionar-compras/registrar-ajustes/ajustes', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('DEBUG: Response data:', data);
                        
                        if (data.success) {
                            Swal.fire({
                                title: '¡Ajuste registrado!',
                                text: data.mensaje,
                                icon: 'success',
                                confirmButtonText: 'Ir al listado'
                            }).then(() => {
                                location.replace("{{ url_for('ajustemod.ajustes_index') }}");
                            });
                        } else {
                            Swal.fire('Error', data.error, 'error');
                        }
                    })
                    .catch(error => {
                        console.error('Error al registrar:', error);
                        Swal.fire('Error', 'No se pudo registrar el ajuste', 'error');
                    });
                }
            });
        });
    }

    // ========== VOLVER ==========
    function eventoVolver() {
        $('#btn_volver').on('click', function() {
            console.log('DEBUG: Volviendo al listado');
            location.replace("{{ url_for('ajustemod.ajustes_index') }}");
        });
    }
</script>
{% endblock %}
