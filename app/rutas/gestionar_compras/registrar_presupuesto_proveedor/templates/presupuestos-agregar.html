{% extends 'base.html' %}

{% block titulo %}
Formulario Presupuesto Proveedor
{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>Formulario Presupuesto de Proveedor</h3>
        </div>
        <div class="card-body">
            <div class="row">
                <!-- Columna izquierda -->
                <div class="col-md-6 d-flex flex-column">
                  <!-- Combo empleados -->
                  <div class="form-group">
                    <label for="cbo_empleado">Empleados:</label>
                    <select id="cbo_empleado" class="custom-select">
                      <option selected>Empleados</option>
                      {% for item in empleados %}
                      <option value="{{ item['id_empleado'] }}">
                        {{ item['empleado'] }} - CI: {{ item['ci'] }}
                      </option>
                      {% endfor %}
                    </select>
                  </div>
              
                  <!-- Combo sucursales -->
                  <div class="form-group">
                    <label for="cbo_sucursal">Sucursales:</label>
                    <select id="cbo_sucursal" class="custom-select">
                      <option value="">Sucursales</option>
                      {% for item in sucursales %}
                      <option value="{{ item['id'] }}">
                        {{ item['descripcion'] }}
                      </option>
                      {% endfor %}
                    </select>
                  </div>
                  
                  <!-- Fecha de Pedido -->
                  <div class="form-group">
                    <label for="txt_fecha_de_pedido">Fecha de Pedido:</label>
                    <input type="date" class="form-control" id="txt_fecha_de_pedido" />
                  </div>

                  <!-- Fecha de Vencimiento -->
                  <div class="form-group">
                    <label for="txt_fecha_vencimiento">Fecha de Vencimiento:</label>
                    <input type="date" class="form-control" id="txt_fecha_vencimiento" />
                  </div>
                </div>
              
                <!-- Columna derecha -->
                <div class="col-md-6 d-flex flex-column">
                  <!-- Combo pedido -->
                  <div class="form-group">
                    <label for="cbo_pedido">Pedido por número y fecha:</label>
                    <select id="cbo_pedido" class="custom-select">
                      <option value="">Seleccione un pedido</option>
                      {% for pedido in pedidos %}
                      <option value="{{ pedido['id_pedido_compra'] }}">
                          Pedido N° {{ pedido['id_pedido_compra'] }} - Fecha: {{ pedido['fecha_pedido'] }}
                      </option>
                      {% endfor %}
                    </select>
                  </div>
                  
                  <!-- Combo proveedor -->
                  <div class="form-group">
                    <label for="cbo_proveedor">Proveedores</label>
                    <select id="cbo_proveedor" class="custom-select">
                      <option value="">Proveedores</option>
                      {% for item in proveedores %}
                      <option value="{{ item['id_proveedor'] }}">
                        {{ item['proveedor'] }}
                      </option>
                      {% endfor %}
                    </select>
                  </div>
                  <!-- Radio buttons para el estado del presupuesto -->
                  <div class="row mt-3">
                      <div class="col-md-12">
                          <label for="estado_presupuesto">Estado del Presupuesto:</label><br>
                          <div class="form-check form-check-inline">
                              <input class="form-check-input" type="radio" name="estado_presupuesto" id="estado_aprobado" value="aprobado">
                              <label class="form-check-label" for="estado_aprobado">Aprobado</label>
                          </div>
                          <div class="form-check form-check-inline">
                              <input class="form-check-input" type="radio" name="estado_presupuesto" id="estado_pendiente" value="pendiente" checked>
                              <label class="form-check-label" for="estado_pendiente">Pendiente</label>
                          </div>
                          <div class="form-check form-check-inline">
                              <input class="form-check-input" type="radio" name="estado_presupuesto" id="estado_rechazado" value="rechazado">
                              <label class="form-check-label" for="estado_rechazado">Rechazado</label>
                          </div>
                      </div>
                  </div>
                </div>
            </div>
            
            <hr>
            <div class="row">
                <div class="col col-md-12">
                  <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio Ofertado</th>
                        </tr>
                    </thead>
                    <tbody id="productos-table-body">
                        
                    </tbody>
                </table>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <button type="button" class="btn btn-primary" id="btn_registrar_pedido">Registrar Presupuesto</button>
            <button type="button" class="btn btn-secondary btn-icon-split" id="btn_volver">
        <span class="icon text-white-50">
            <i class="fas fa-arrow-left"></i>
        </span>
        <span class="text">Volver al Listado</span>
    </button>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
  // ========== ARRAY GLOBAL PARA ALMACENAR PRODUCTOS ==========
  let productosPresupuesto = [];

  // ========== VALIDACIÓN DE FECHAS ==========
  function validarFechas() {
    const fechaPedido = new Date(document.getElementById('txt_fecha_de_pedido').value);
    const fechaVencimiento = new Date(document.getElementById('txt_fecha_vencimiento').value);

    if (fechaVencimiento < fechaPedido) {
      Swal.fire('Error', 'La Fecha de Vencimiento no puede ser anterior a la Fecha de Pedido.', 'error');
      return false;
    }
    return true;
  }

  // ========== EVENTO: CAMBIO DE PEDIDO ==========
  document.getElementById('cbo_pedido').addEventListener('change', function () {
    const pedidoId = this.value;
    
    console.log('DEBUG: Pedido seleccionado:', pedidoId);

    if (pedidoId) {
      // Solicitar el detalle del pedido a la API
      fetch(`/api/v1/gestionar-compras/registrar-pedido-compras/detalle-pedido/${pedidoId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error(`Error en la respuesta: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          console.log('DEBUG: Detalle recibido:', data);
          
          if (data.success) {
            const tableBody = document.getElementById('productos-table-body');
            tableBody.innerHTML = ''; // Limpiar tabla
            
            // ✅ LIMPIAR Y RECREAR EL ARRAY
            productosPresupuesto = [];

            data.data.forEach(producto => {
              console.log('DEBUG: Procesando producto:', producto);
              
              // ✅ AGREGAR AL ARRAY GLOBAL
              productosPresupuesto.push({
                id_producto: producto.id_producto,
                nombre: producto.nombre,
                cantidad: producto.cantidad,
                precio_unitario: producto.precio_unitario || 0  // ✅ Usar precio del pedido
              });
              
              // ✅ AGREGAR A LA TABLA CON PRECIO
              const row = `
                <tr data-id="${producto.id_producto}">
                  <td>${producto.id_producto}</td>
                  <td>${producto.nombre}</td>
                  <td>
                      <input type="number" class="form-control cantidad-producto" 
                             value="${producto.cantidad}" min="1" 
                             data-id="${producto.id_producto}">
                  </td>
                  <td>
                      <input type="number" class="form-control precio-producto" 
                             value="${producto.precio_unitario || 0}" min="0" step="0.01"
                             data-id="${producto.id_producto}">
                  </td>
                </tr>`;
              tableBody.innerHTML += row;
            });
            
            console.log('DEBUG: Productos cargados en array:', productosPresupuesto);
            
            // ✅ AGREGAR EVENTOS PARA ACTUALIZAR EL ARRAY AL CAMBIAR VALORES
            agregarEventosCambio();
            
          } else {
            Swal.fire('Error', 'No se encontraron detalles para este pedido.', 'error');
          }
        })
        .catch(error => {
          console.error('Error al cargar productos:', error);
          Swal.fire('Error', 'Ocurrió un error al cargar los detalles del pedido.', 'error');
        });
    } else {
      // Limpiar la tabla si no se seleccionó un pedido
      document.getElementById('productos-table-body').innerHTML = '';
      productosPresupuesto = [];
    }
  });

  // ========== EVENTOS PARA ACTUALIZAR ARRAY AL CAMBIAR CANTIDAD O PRECIO ==========
  function agregarEventosCambio() {
    // Evento al cambiar cantidad
    document.querySelectorAll('.cantidad-producto').forEach(input => {
      input.addEventListener('input', function() {
        const idProducto = Number(this.dataset.id);
        const nuevaCantidad = Number(this.value);
        
        console.log(`DEBUG: Cambiando cantidad del producto ${idProducto} a ${nuevaCantidad}`);
        
        // Actualizar en el array
        const producto = productosPresupuesto.find(p => p.id_producto === idProducto);
        if (producto) {
          producto.cantidad = nuevaCantidad;
        }
        
        console.log('DEBUG: Array actualizado:', productosPresupuesto);
      });
    });
    
    // Evento al cambiar precio
    document.querySelectorAll('.precio-producto').forEach(input => {
      input.addEventListener('input', function() {
        const idProducto = Number(this.dataset.id);
        const nuevoPrecio = Number(this.value);
        
        console.log(`DEBUG: Cambiando precio del producto ${idProducto} a ${nuevoPrecio}`);
        
        // Actualizar en el array
        const producto = productosPresupuesto.find(p => p.id_producto === idProducto);
        if (producto) {
          producto.precio_unitario = nuevoPrecio;
        }
        
        console.log('DEBUG: Array actualizado:', productosPresupuesto);
      });
    });
  }

  // ========== REGISTRAR PRESUPUESTO ==========
  document.getElementById('btn_registrar_pedido').addEventListener('click', function () {
    console.log('DEBUG: Iniciando registro de presupuesto...');
    
    if (!validarFechas()) {
      return;
    }

    // ✅ ACTUALIZAR ARRAY CON VALORES FINALES DE LA TABLA
    productosPresupuesto = [];
    const rows = document.querySelectorAll('#productos-table-body tr');
    
    console.log(`DEBUG: Procesando ${rows.length} filas de productos`);

    rows.forEach((row, index) => {
      const idProducto = Number(row.dataset.id);
      const cantidad = Number(row.querySelector('.cantidad-producto').value);
      const precioUnitario = Number(row.querySelector('.precio-producto').value);
      
      console.log(`DEBUG: Fila ${index + 1}: id=${idProducto}, cantidad=${cantidad}, precio=${precioUnitario}`);

      // ✅ AGREGAR INCLUSO SI PRECIO ES 0
      if (idProducto && cantidad) {
        productosPresupuesto.push({
          id_producto: idProducto,
          precio_unitario: precioUnitario,
          cantidad: cantidad
        });
      }
    });

    console.log('DEBUG: Productos a enviar:', productosPresupuesto);
    console.log('DEBUG: Cantidad de productos:', productosPresupuesto.length);

    // Validar que haya productos
    if (productosPresupuesto.length === 0) {
      Swal.fire('Error', 'Debe agregar al menos un producto al presupuesto.', 'error');
      return;
    }

    const estadoPresupuesto = document.querySelector('input[name="estado_presupuesto"]:checked').value;

    const payload = {
      id_empleado: Number(document.getElementById('cbo_empleado').value),
      id_sucursal: Number(document.getElementById('cbo_sucursal').value),
      fecha_presupuesto: document.getElementById('txt_fecha_de_pedido').value,
      fecha_vencimiento: document.getElementById('txt_fecha_vencimiento').value,
      id_proveedor: Number(document.getElementById('cbo_proveedor').value),
      id_pedido_compra: Number(document.getElementById('cbo_pedido').value),
      detalle_presupuesto: productosPresupuesto,  // ✅ Usar el array global
      estado: estadoPresupuesto
    };

    console.log('DEBUG: Payload final a enviar:', payload);
    console.log('DEBUG: Payload JSON:', JSON.stringify(payload, null, 2));

    // ✅ MOSTRAR LOADING DE SWEETALERT2
    Swal.fire({
      title: 'Registrando presupuesto...',
      allowOutsideClick: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });

    // Enviar el presupuesto a la API
    fetch(`/api/v1/gestionar-compras/registrar-presupuesto-proveedor/presupuestos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
    .then(response => {
      console.log('DEBUG: Response status:', response.status);
      return response.json().then(data => {
        if (!response.ok) {
          throw new Error(data.error || 'Error al procesar la solicitud');
        }
        return data;
      });
    })
    .then(data => {
      console.log('DEBUG: Response data:', data);
      
      if (data.success) {
        // ✅ SWEETALERT2 DE ÉXITO
        Swal.fire({
          title: '¡Presupuesto registrado!',
          text: 'El presupuesto se ha registrado correctamente.',
          icon: 'success',
          confirmButtonText: 'Ir al listado'
        }).then(() => {
          // ✅ REDIRIGIR AL INDEX
          location.replace("{{ url_for('pdpmod.presupuestos_index') }}");
        });
      } else {
        Swal.fire('Error', data.error || 'Error al registrar el presupuesto.', 'error');
      }
    })
    .catch(error => {
      console.error('Error al registrar presupuesto:', error);
      // ✅ SWEETALERT2 DE ERROR
      Swal.fire({
        title: 'No se pudo registrar el presupuesto',
        text: error.message,
        icon: 'warning'
      });
    });
  });

  // ========== BOTÓN VOLVER ==========
  document.getElementById('btn_volver').addEventListener('click', function() {
    window.close();
    setTimeout(() => {
      location.replace("{{ url_for('pdpmod.presupuestos_index') }}");
    }, 100);
  });
</script>
{% endblock %}
