{% extends 'base.html' %}

{% block titulo %}
Gestionar Compras
{% endblock %}

{% block contenido %}
<div class="container-fluid">
    <!-- Encabezado -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Gestión de Compras</h1>
        <a href="{{ url_for('compramod.compras_gestion') }}" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
            <i class="fas fa-plus fa-sm text-white-50"></i> Registrar Compra
        </a>
    </div>

    <!-- Tabla de Compras -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Listado de Compras</h6>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover" id="tbl_compras" width="100%" cellspacing="0">
                    <thead class="thead-light">
                        <tr>
                            <th>ID</th>
                            <th>N° Factura</th>
                            <th>Fecha</th>
                            <th>Proveedor</th>
                            <th>Sucursal</th>
                            <th>Tipo</th>
                            <th>Total</th>
                            <th>Saldo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- DataTable carga dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    $(document).ready(function() {
        cargarCompras();
        eventoVer();
        eventoAnular();
        eventoFinalizar();
    });

    function cargarCompras() {
        const tabla = $('#tbl_compras').DataTable({
            ajax: {
                url: '/api/v1/gestionar-compras/gestionar-compra/compras',
                dataSrc: function(json) {
                    if (json.success) {
                        return json.data;
                    } else {
                        Swal.fire('Error', json.error, 'error');
                        return [];
                    }
                },
                error: function(xhr, error, thrown) {
                    Swal.fire('Error', 'No se pudieron cargar las compras', 'error');
                }
            },
            columns: [
                { data: 'id_compra' },
                { data: 'nro_factura' },
                { data: 'fecha_compra' },
                { data: 'proveedor' },
                { data: 'sucursal' },
                { data: 'tipo_factura' },
                { 
                    data: 'total_compra',
                    render: function(data) {
                        return parseFloat(data).toLocaleString('es-PY', {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        });
                    }
                },
                { 
                    data: 'saldo',
                    render: function(data) {
                        return parseFloat(data).toLocaleString('es-PY', {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        });
                    }
                },
                {
                    data: 'estado',
                    render: function(data) {
                        let badge = '';
                        if (data === 'Registrada') {
                            badge = '<span class="badge badge-warning">Registrada</span>';
                        } else if (data === 'Finalizada') {
                            badge = '<span class="badge badge-success">Finalizada</span>';
                        } else if (data === 'Anulada') {
                            badge = '<span class="badge badge-danger">Anulada</span>';
                        }
                        return badge;
                    }
                },
                {
                    data: null,
                    orderable: false,
                    render: function(data, type, row) {
                        let botones = `
                            <button class="btn btn-info btn-sm btn-ver" data-id="${row.id_compra}" title="Ver Detalle">
                                <i class="fas fa-eye"></i>
                            </button>
                        `;

                        // Botón Finalizar (solo si está Registrada)
                        if (row.estado === 'Registrada') {
                            botones += `
                                <button class="btn btn-success btn-sm btn-finalizar" data-id="${row.id_compra}" title="Finalizar">
                                    <i class="fas fa-check"></i>
                                </button>
                            `;
                        }

                        // Botón Anular (solo si no está Finalizada ni Anulada)
                        if (row.estado !== 'Finalizada' && row.estado !== 'Anulada') {
                            botones += `
                                <button class="btn btn-danger btn-sm btn-anular" data-id="${row.id_compra}" title="Anular">
                                    <i class="fas fa-ban"></i>
                                </button>
                            `;
                        }

                        return botones;
                    }
                }
            ],
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            },
            order: [[0, 'desc']],
            pageLength: 10
        });
    }

    function eventoVer() {
        $('#tbl_compras').on('click', '.btn-ver', function() {
            const idCompra = $(this).data('id');
            window.open(
                `/gestionar-compras/gestionar-compra/compras-ver/${idCompra}`,
                '_blank',
                'width=1200,height=800'
            );
        });
    }

    
    function eventoAnular() {
        $('#tbl_compras').on('click', '.btn-anular', function() {
            const idCompra = $(this).data('id');

            Swal.fire({
                title: '¿Anular esta compra?',
                text: 'Esta acción no se puede deshacer',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, anular',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Loading
                    Swal.fire({
                        title: 'Anulando...',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    // Request
                    fetch(`/api/v1/gestionar-compras/gestionar-compra/compras/${idCompra}/anular`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'}
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            Swal.fire('¡Anulada!', data.mensaje, 'success')
                                .then(() => {
                                    $('#tbl_compras').DataTable().ajax.reload();
                                });
                        } else {
                            Swal.fire('Error', data.error, 'error');
                        }
                    })
                    .catch(error => {
                        Swal.fire('Error', 'No se pudo anular la compra', 'error');
                    });
                }
            });
        });
    }

    function eventoFinalizar() {
        $('#tbl_compras').on('click', '.btn-finalizar', function() {
            const idCompra = $(this).data('id');

            Swal.fire({
                title: '¿Finalizar esta compra?',
                text: 'Una vez finalizada no se podrá modificar',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#28a745',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, finalizar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Loading
                    Swal.fire({
                        title: 'Finalizando...',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    // Request
                    fetch(`/api/v1/gestionar-compras/gestionar-compra/compras/${idCompra}/finalizar`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'}
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            Swal.fire('¡Finalizada!', data.mensaje, 'success')
                                .then(() => {
                                    $('#tbl_compras').DataTable().ajax.reload();
                                });
                        } else {
                            Swal.fire('Error', data.error, 'error');
                        }
                    })
                    .catch(error => {
                        Swal.fire('Error', 'No se pudo finalizar la compra', 'error');
                    });
                }
            });
        });
    }
</script>
{% endblock %}
